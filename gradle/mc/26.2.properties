# =============================================================================
# Minecraft 26.2 - the versions this line builds against.
#
# Selected by -Pmc=26.2 on the command line (the default line is `mc` in gradle.properties). The same
# rules as gradle/mc/26.3.properties: settings.gradle hands every key to every project as an extra
# property, the file name must equal minecraft_version, a key lives here or in gradle.properties and
# never in both, and every line file carries the same set of keys.
#
# KEEP EVERY VALUE ASCII: Gradle reads properties files as ISO-8859-1.
# =============================================================================

# --- Minecraft ---
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
# Mojang-mapped vanilla classpath for :common-mc. NeoForge 26.2.0.67 requires NeoForm 26.2-2 (read from
# its .module metadata, docs/PORTING.md; 027 compiles against 26.2-1 with the same NeoForge), so the
# shared code compiles against the same vanilla the loader runs.
# Versions: https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-2

# --- Fabric (https://fabricmc.net/develop/) ---
# *_version is what we build and run against; *_min_version is the floor the mod DECLARES to players
# (see gradle/mc/26.3.properties). The floors on this line equal the dev pins: nothing older was tested.
#
# Fabric Loader 0.19.3 is the owner's pin for this line (060 OPEN no. 25), two patch releases behind
# 26.3. The Loader floor also picks the Mixin compatibility level: a floor below 0.19.4 gives the soft
# level, where a missing target of a @Mixin in a required config is a warning, not a crash. On this line
# the guard against a mixin that silently stopped applying is weaker than on 26.3 - check the log of a
# dev run for "Mixin apply" warnings after touching a mixin (docs/MC-26.2-API.md, ADR-014).
fabric_loader_version=0.19.3
fabric_loader_min_version=0.19.3
# 0.161.0+26.2 is the newest Fabric API for 26.2 (the same release number as the 26.3 pin). Its client
# game-test module is 6.0.2, whose TestSingleplayerContext has getConnection() like 26.3 - from 0.156 on;
# up to 0.155.2 the module (5.1.x) still has getClientLevel(), which is why 036 holds 0.155.2.
fabric_version=0.161.0+26.2
fabric_api_min_version=0.161.0+26.2

# --- NeoForge (https://projects.neoforged.net/neoforged/neoforge) ---
# The owner's pin for this line (060 OPEN no. 25). The floor is the pin: it is a requirement on every
# player, raise it only by decision (ADR-014).
neoforge_version=26.2.0.67
neoforge_min_version=26.2.0.67

# --- Mod Menu (compile-time API and dev runs only; never a dependency of the mod) ---
# The Mod Menu release for this line (Modrinth lists 20.0.0 .. 20.0.3 for 26.2): the pin the template
# had before the move to 26.3; the artifact is maven.modrinth:mOgUt4GM.
modmenu_version=20.0.1
