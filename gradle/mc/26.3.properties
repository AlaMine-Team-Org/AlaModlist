# =============================================================================
# Minecraft 26.3 - the versions this line builds against.
#
# Selected by `mc` in gradle.properties, or by -Pmc=26.3 on the command line. settings.gradle reads
# this file and hands every key to every project as an extra property before its build script runs,
# so the scripts and build-logic read `minecraft_version` exactly as if it sat in gradle.properties.
# The file name must equal minecraft_version. A key lives here or in gradle.properties, never in both.
#
# KEEP EVERY VALUE ASCII: Gradle reads properties files as ISO-8859-1.
# =============================================================================

# --- Minecraft ---
# Minecraft 26.3. Java 25 is mandatory from 26.1 onwards (java_version in gradle.properties).
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
# Mojang-mapped vanilla classpath for :common-mc (the loader-neutral module). NeoForge 26.3 itself
# is built on 26.3-1, so the shared code compiles against the same vanilla the loader runs.
# Versions: https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# --- Fabric (https://fabricmc.net/develop/) ---
# *_version is what we build and run against; *_min_version is the floor the mod DECLARES to players.
# Separate on purpose: a floor is a requirement on every player, so bumping the dev pin must not raise
# it by accident. The Fabric Loader floor also sets the Mixin compatibility level - declared >= 0.19.4,
# a missing target in a required mixin config is a crash instead of a warning, which is what we want
# for our own mixins. Lower a floor only after testing on that exact version.
fabric_loader_version=0.19.5
fabric_loader_min_version=0.19.5
fabric_version=0.161.0+26.3
fabric_api_min_version=0.161.0+26.3

# --- NeoForge (https://projects.neoforged.net/neoforged/neoforge) ---
# Same split as Fabric. neoforge_min_version is what players see as the requirement - keep the
# Requirements section of the store pages in step with it.
neoforge_version=26.3.0.99
# 26.3.0.20-beta replaced DataPackRegistryEvent with NewDatapackRegistryEvent; anything older
# than the first stable build is not a floor worth declaring (036 MOD-910).
neoforge_min_version=26.3.0.99

# --- Mod Menu (compile-time API and dev runs only; never a dependency of the mod) ---
# The Mod Menu release for this line; the artifact is maven.modrinth:mOgUt4GM (Modrinth maven).
modmenu_version=21.0.0-beta.1
