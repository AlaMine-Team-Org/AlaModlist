# =============================================================================
# Ala Modlist - single source of truth for the mod metadata and the build settings.
# The versions tied to a Minecraft line (Minecraft, NeoForm, Fabric, NeoForge, Mod Menu) live in
# gradle/mc/<line>.properties; `mc` below picks the line.
#
# processResources (build-logic/src/main/groovy/multiloader-common.gradle) expands these keys into
# fabric.mod.json, neoforge.mods.toml and alamodlist.build.json; the gates under tools/ and the
# publishing scripts read the same keys. Anything the metadata needs lives here, not in the version
# catalog: a catalog is not readable from that expansion.
#
# KEEP EVERY VALUE ASCII. Gradle reads this file as ISO-8859-1, so a UTF-8 character arrives in the
# jar double-encoded - an em dash in a description shipped as mojibake in two of our mods already.
# The one value that wants non-ASCII text, the store description, lives in mod_description.txt.
# =============================================================================

org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Must stay off: the configuration cache breaks the IntelliJ run configurations Loom generates
# (FabricMC/fabric-loom#1349). The BUILD cache below is a different thing and is safe to keep on;
# release builds still run with --no-build-cache, because a test task restored from the cache is a
# test that did not run.
org.gradle.configuration-cache=false
org.gradle.caching=true

# --- Project ---
version=0.1.0
group=day.alacraft.alamodlist
java_version=25

# --- Mod metadata ---
mod_id=alamodlist
mod_name=Ala Modlist
mod_author=AlaCraft
# SPDX identifier. Must match LICENSE and the license chosen on the store pages.
license=MIT
# Where the mod runs, in fabric.mod.json terms: '*' = client and server (content, networking,
# server logic), 'client' = client-only mod. One value feeds fabric.mod.json "environment", the
# NeoForge dependency side, and the Modrinth/CurseForge environment of every published version.
mod_environment=client
mod_homepage_url=https://github.com/AlaMine-Team-Org/AlaModlist
mod_sources_url=https://github.com/AlaMine-Team-Org/AlaModlist
mod_issues_url=https://github.com/AlaMine-Team-Org/AlaModlist/issues
# description: see mod_description.txt

# --- Minecraft line ---
# The Minecraft line this build is for. It names a file in gradle/mc/ (gradle/mc/<line>.properties) that
# holds every version tied to that line: minecraft_version and its range, NeoForm, Fabric Loader and API,
# NeoForge, their declared minimums and Mod Menu. settings.gradle hands those keys to every project, so a
# build script reads `minecraft_version` as if it were declared here - and a key is declared in ONE of the
# two files, never both. Override from the command line with -Pmc=<line>.
mc=26.3
